# For the nginx-proxy front, not this image: install as
# /etc/nginx/vhost.d/<VIRTUAL_HOST>_location in the nginx-proxy container
# (README.md, "Front settings").  nginx-proxy includes it in the host's
# `location /`, which also carries /gprs.  The default 60 s would close an
# idle /gprs WebSocket long before the gateway's own 15-minute idle close.
#
# Keep proxy_set_header and add_header out of this file: either one here
# drops the front's own Upgrade/Connection/X-Forwarded-* (or HSTS) headers
# for this location.
proxy_read_timeout 960s;
proxy_send_timeout 960s;
