# Static host for the qemu-pmb887x wasm page, webroot = the bundle from
# scripts/bundle-dist.sh (COPY'd to /usr/share/nginx/html by the
# Dockerfile next to this file).  Fronted by the perk11/nginx-proxy
# compose stack (jwilder/nginx-proxy + letsencrypt companion), which
# terminates TLS and proxies here on port 80.
#
# Mirrors the serve.mjs contract:
#  - COOP/COEP on every response: the emulator is built with pthreads
#    (SharedArrayBuffer), so the page must be crossOriginIsolated.
#    Browsers only honor these headers on secure contexts — provided by
#    the outer proxy's TLS (or by http://localhost for local runs).
#    require-corp, not credentialless: Safari supports only require-corp
#    and this page loads same-origin resources exclusively.
#  - cache-control: no-cache + a strong ETag (size+mtime, `etag on`):
#    every visit revalidates, so a redeployed bundle is picked up on the
#    next reload; unchanged files come back as 304s served from the HTTP
#    cache — which also lets Chromium keep its wasm code cache for
#    qemu-system-arm.wasm (incl. the TurboFan tier-up) across visits.
#  - the bundle's pre-gzip'd .gz sidecars via gzip_static: the ~28 MB
#    dist-jit wasm ships as its ~4 MB sidecar; on-the-fly gzip only
#    exists as a fallback for anything without one.

server {
    listen 80 default_server;
    server_name _;          # vhost routing happens at the nginx-proxy

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Exactly the types the bundle ships — self-contained, so the mapping
    # never depends on the base image's mime.types revision.  wasm must be
    # application/wasm for instantiateStreaming (streaming compilation).
    types {
        text/html                html htm;
        text/css                 css;
        text/javascript          js mjs;
        application/json         json;
        application/wasm         wasm;
        application/x-tar        tar;
        application/octet-stream bin symbols;
        image/png                png;
        image/svg+xml            svg;
        text/plain               txt md;
    }
    default_type application/octet-stream;

    # Precompressed sidecars first (chosen at open-file time, no CPU),
    # dynamic gzip as a fallback for anything without one.
    gzip_static on;
    gzip on;
    gzip_comp_level 5;
    gzip_proxied any;       # we always sit behind the nginx-proxy
    gzip_types text/css text/javascript application/json application/wasm
               application/x-tar application/octet-stream;

    # One Vary on every response (identity vs .gz is picked per request;
    # pinned here instead of gzip_vary so exactly one header goes out,
    # sidecar or not).
    add_header Vary "Accept-Encoding" always;

    # Cross-origin isolation (see header comment) — on every response,
    # including 304/404, hence `always`.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # Hygiene/hardening — nothing here is framed or loaded cross-origin.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Content-Type-Options       "nosniff"     always;
    add_header X-Frame-Options              "SAMEORIGIN"  always;
    add_header Referrer-Policy              "strict-origin-when-cross-origin" always;

    # The cache contract (see header comment).  etag is on by default for
    # static files — spelled out because the whole scheme leans on it.
    etag on;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
