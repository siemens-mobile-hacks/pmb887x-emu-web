# qemu-pmb887x web container, wired for the perk11/nginx-proxy front
# (github.com/perk11/nginx-proxy): jwilder/nginx-proxy + the letsencrypt
# companion, both on the external `nginx-proxy` docker network.  The
# proxy watches the docker socket, sees VIRTUAL_HOST below and generates
# the vhost (TLS + http→https redirect once the letsencrypt companion has
# issued the cert — see the front repo's README for the one-time setup).
#
# Usage (bundle first — the Dockerfile COPYs it):
#   scripts/bundle-dist.sh
#   VIRTUAL_HOST=emu.example.org \
#   LETSENCRYPT_HOST=emu.example.org \
#   LETSENCRYPT_EMAIL=you@example.org \
#     docker compose up -d --build
#
# Or put those variables in deploy/nginx/.env (gitignored) and just run
# `docker compose up -d --build`.
#
# The phone's Internet (GPRS gateway at /gprs, ../gprs-gw/README.md) is the
# `gprs` profile: COMPOSE_PROFILES=gprs, plus a bts-emulator checkout of
# branch gprs-gw at BTS_EMULATOR (default ../../../bts-emulator).  The front
# must not close an idle /gprs after nginx's default 60 s: the proxy-timeout
# label below (README.md, "What the front is").
services:
  pmb887x-web:
    build:
      # NB: "../.." is deliberate. Compose v2 resolves this to the repo
      # root either way, but legacy docker-compose v1 joins the dockerfile
      # path as compose-dir + context + dockerfile WITHOUT normalising
      # dot-dots, so "../.." is required to make that concatenation land on
      # deploy/nginx/Dockerfile instead of a bogus deploy/deploy/... path.
      context: ../..
      dockerfile: deploy/nginx/Dockerfile
    image: pmb887x-web
    container_name: pmb887x-web
    restart: unless-stopped
    expose:
      - "80"
    labels:
      # perk11/nginx-proxy's own label: the front keeps an idle /gprs past the
      # gateway's 15-minute idle close instead of nginx's 60 s. A stock
      # nginx-proxy ignores it (README.md, "What the front is").
      com.github.perk11.nginx-proxy.proxy-timeout: "960s"
    environment:
      # picked up by jwilder/nginx-proxy via the docker socket
      VIRTUAL_HOST: ${VIRTUAL_HOST:-emu.example.org}
      VIRTUAL_PORT: "80"
      # picked up by the letsencrypt companion via the docker socket
      # (needs DNS for the host to point at the proxy; the http→https
      # redirect appears automatically once the cert is issued)
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-emu.example.org}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-you@example.org}
    networks:
      - default
      - gprs

  pmb887x-gprs-gw:
    profiles: [gprs]
    build:
      context: ../gprs-gw
      additional_contexts:
        bts: ${BTS_EMULATOR:-../../../bts-emulator}
    image: pmb887x-gprs-gw
    container_name: pmb887x-gprs-gw
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # node's threads plus one slirp-pipe per connection (GPRS_GW_MAX_SESSIONS);
    # measured about 70 MB for node and 3 MB per idle slirp-pipe
    pids_limit: 256
    mem_limit: 1g
    expose:
      - "5751"
    # An empty value leaves the gateway's default (../gprs-gw/README.md).
    environment:
      GPRS_GW_ORIGINS: ${GPRS_GW_ORIGINS:-https://${VIRTUAL_HOST:-emu.example.org}}
      # nginx-proxy front + pmb887x-web, each appending to X-Forwarded-For
      GPRS_GW_TRUSTED_PROXIES: ${GPRS_GW_TRUSTED_PROXIES:-2}
      GPRS_GW_PER_IP: ${GPRS_GW_PER_IP:-}
      GPRS_GW_DAILY_BYTES: ${GPRS_GW_DAILY_BYTES:-}
      GPRS_GW_DOWN_RATE: ${GPRS_GW_DOWN_RATE:-}
      GPRS_GW_DOWN_BURST: ${GPRS_GW_DOWN_BURST:-}
      GPRS_GW_BAN_RATE: ${GPRS_GW_BAN_RATE:-}
      GPRS_GW_BAN_FRAMES: ${GPRS_GW_BAN_FRAMES:-}
      GPRS_GW_BAN_DAYS: ${GPRS_GW_BAN_DAYS:-}
      GPRS_GW_IDLE: ${GPRS_GW_IDLE:-}
      GPRS_GW_MAX_SESSIONS: ${GPRS_GW_MAX_SESSIONS:-}
      GPRS_GW_ATTEMPTS: ${GPRS_GW_ATTEMPTS:-}
      GPRS_GW_TCP_PORTS: ${GPRS_GW_TCP_PORTS:-}
      GPRS_GW_NEW_FLOWS: ${GPRS_GW_NEW_FLOWS:-}
      GPRS_GW_HOSTS: ${GPRS_GW_HOSTS:-}
    volumes:
      - gprs-gw-state:/var/lib/gprs-gw
    networks:
      - gprs
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  default:
    name: nginx-proxy
    external: true
  # pmb887x-web <-> gateway only; also the gateway's way out to the Internet
  gprs: {}

volumes:
  gprs-gw-state:
